name: Publish agentdrift to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build

      - name: Verify tag matches package version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Skipping tag/version check for non-version-tag ref: $GITHUB_REF"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "tag=$TAG pyproject=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $VERSION."
            exit 1
          fi

      - name: Run Ruff checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-and-release:
    name: Publish to PyPI + GitHub Release
    needs: [lint-test-build]
    if: needs.lint-test-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract package version from pyproject.toml
        id: pkg-version
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check PyPI for the package version
        id: check-pypi
        env:
          PACKAGE_VERSION: ${{ steps.pkg-version.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://pypi.org/pypi/agentdrift-mcp/${PACKAGE_VERSION}/json"
          HTTP_STATUS="$(curl --silent --show-error --location --output /dev/null --write-out "%{http_code}" "$URL")"
          case "$HTTP_STATUS" in
            200)
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "Version ${PACKAGE_VERSION} already exists on PyPI; skipping publish and release."
              ;;
            404)
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              echo "Version ${PACKAGE_VERSION} is not on PyPI; proceeding with publish and release."
              ;;
            *)
              echo "::error::Unexpected PyPI API response: HTTP ${HTTP_STATUS}"
              exit 1
              ;;
          esac

      - name: Publish to PyPI with Trusted Publishing
        if: steps.check-pypi.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Generate structured release summary
        if: steps.check-pypi.outputs.should_publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.pkg-version.outputs.tag_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/generate_release_notes.py

      - name: Create GitHub Release and version tag
        if: steps.check-pypi.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.pkg-version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "Release ${{ steps.pkg-version.outputs.tag_name }}"
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.whl
            dist/*.tar.gz
