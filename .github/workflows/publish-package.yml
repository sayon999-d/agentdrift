name: Publish agentdrift to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: # Manual runs may publish from main or a version tag.

permissions:
  contents: read

jobs:
  build-test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag matches package version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Skipping tag/version check for non-version-tag ref: $GITHUB_REF"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$TAG pyproject=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $PKG. Bump [project].version / agentdrift.__version__ first."
            exit 1
          fi

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: python -m pytest tests/ -q

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI + GitHub Release
    # Main pushes remain CI-only. Manual runs publish after CI from the
    # selected ref, while automatic publishing is limited to version tags.
    if: >-
      ${{
        needs.build-test.result == 'success' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        )
      }}
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create the GitHub Release
      id-token: write # Needed for PyPI Trusted Publishing
    steps:
      - name: Check out release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Generate structured release summary
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/generate_release_notes.py

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release with generated notes and artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.whl
            dist/*.tar.gz
