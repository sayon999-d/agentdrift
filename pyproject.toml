[project]
name = "agentdrift"
version = "0.1.0"
description = "AgentDrift drift-detection daemon (FastAPI) + terminal CLI — Python port of the Rust daemon"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pgvector>=0.3",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "sentence-transformers>=3.0",
  "httpx>=0.27",
  "typer>=0.9",
  "rich>=13",
  "requests>=2.31",
  "lancedb>=0.6",
  "pyarrow>=14",
  "fastmcp>=2.0",
  "pyjwt[crypto]>=2.10",
  "starlette>=0.40,<0.50",
]

[project.scripts]
agentdrift = "cli:main"
agentdrift-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["cli", "mcp_server"]

[tool.setuptools.packages.find]
include = ["app*", "agentdrift*"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
nli = ["transformers>=4.40", "torch>=2.0"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
