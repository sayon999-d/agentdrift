[project]
name = "agentdrift-mcp"
version = "2.10.2"
description = "Coding-agent runtime supervisor, CLI, and Model Context Protocol server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pgvector>=0.3",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "sentence-transformers>=3.0",
  "httpx>=0.27",
  "typer>=0.9",
  "rich>=13",
  "requests>=2.31",
  "lancedb>=0.6",
  "pyarrow>=14",
  "fastmcp>=2.0",
  "pyjwt[crypto]>=2.10",
  "starlette>=1.3.1",
]

[project.urls]
Homepage = "https://github.com/sayon999-d/agentdrift"
Documentation = "https://github.com/sayon999-d/agentdrift#readme"
Repository = "https://github.com/sayon999-d/agentdrift"
Issues = "https://github.com/sayon999-d/agentdrift/issues"

[project.scripts]
agentdrift = "agentdrift.cli:main"
agentdrift-mcp = "agentdrift.mcp.server:main"

[tool.setuptools]
py-modules = ["cli", "mcp_server"]

[tool.setuptools.packages.find]
include = ["app*", "agentdrift*"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
nli = ["transformers>=4.40", "torch>=2.0"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agentdrift", "app"]
